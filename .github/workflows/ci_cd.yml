name: BTC forecast CI and CD
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check app src dags kubeflow tests load scripts
      - run: python -m flake8 app src dags kubeflow tests load scripts
      - run: python -m pytest -q

  images:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: btc-api
            dockerfile: app/Dockerfile
          - name: btc-trainer
            dockerfile: src/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ (github.event_name == 'push' && secrets.DOCKER_USERNAME) || 'local' }}/${{ matrix.name }}:${{ github.sha }}
            ${{ (github.event_name == 'push' && secrets.DOCKER_USERNAME) || 'local' }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  kubeflow-spec:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-kfp.txt
      - name: Compile pipeline YAML
        env:
          BTC_TRAINER_IMAGE: ${{ (github.event_name == 'push' && secrets.DOCKER_USERNAME && format('docker.io/{0}/btc-trainer:{1}', secrets.DOCKER_USERNAME, github.sha)) || 'btc-trainer:dev' }}
        run: python kubeflow/btc_kfp_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-kubeflow-pipeline
          path: kubeflow/btc_pipeline.yaml
