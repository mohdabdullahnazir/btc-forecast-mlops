apiVersion: v1
kind: Service
metadata:
  name: btc-api
  namespace: btc-forecast
spec:
  type: ClusterIP
  selector: {app: btc-api}
  ports:
    - {name: http, port: 80, targetPort: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: btc-api-nodeport
  namespace: btc-forecast
spec:
  type: NodePort
  selector: {app: btc-api}
  ports:
    - {name: http, port: 80, targetPort: 5000, nodePort: 30080}
