apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: btc-api
  namespace: btc-forecast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: btc-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
