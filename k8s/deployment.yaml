apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-api
  namespace: btc-forecast
spec:
  replicas: 3
  selector:
    matchLabels: {app: btc-api}
  template:
    metadata:
      labels: {app: btc-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: btc-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          envFrom:
            - configMapRef: {name: btc-api-config}
            - secretRef: {name: btc-api-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - {name: models, mountPath: /app/models}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: btc-models
