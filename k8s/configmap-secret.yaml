apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  namespace: btc-forecast
data:
  MODEL_STAGE: production
  MODEL_ROOT: /app/models
  LOG_LEVEL: info
  PORT: "5000"
  ALLOW_MODEL_UPLOAD: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secrets
  namespace: btc-forecast
type: Opaque
# Set RELOAD_TOKEN in the cluster using the README commands.
