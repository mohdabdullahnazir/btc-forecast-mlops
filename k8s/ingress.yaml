apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btc-api
  namespace: btc-forecast
spec:
  ingressClassName: nginx
  rules:
    - host: btc-forecast.local
      http:
        paths:
          - path: /health
            pathType: Exact
            backend: {service: {name: btc-api, port: {number: 80}}}
          - path: /predict
            pathType: Exact
            backend: {service: {name: btc-api, port: {number: 80}}}
          - path: /metrics
            pathType: Exact
            backend: {service: {name: btc-api, port: {number: 80}}}
